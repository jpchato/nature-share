{% extends 'base.html' %}

{% block extra_head %}
{% load static %}
<link rel="stylesheet" type="text/css" href="{% static 'natureShareApp/images_style.css' %}">
{% endblock %}

{% block content %}
<h2>Organism Images</h2>
<div class="image-gallery">
    {% for organism in organism_images %}
        <article class="image-card">
            <a href="{% url 'organism-detail' organism.id %}">
                {% if organism.picture %}
                    <img src="{{ organism.picture.url }}" alt="{{ organism.name }}" />
                {% else %}
                    <div class="placeholder">No image available</div>
                {% endif %}
                <h3>{{ organism.name }}</h3>
            </a>
        </article>
    {% endfor %}
</div>
<!-- https://www.geeksforgeeks.org/python-uploading-images-in-django/ -->
{% endblock %}
